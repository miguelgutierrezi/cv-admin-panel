<section class="login">
  <header class="login__header">
    <p class="login__brand">CV Admin Panel</p>
    <a class="login__link" [href]="portfolioUrl" rel="noopener noreferrer">Portfolio</a>
  </header>

  <div class="login__card">
    <h1>Iniciar sesión</h1>
    <p class="login__lead">Acceso de un solo autor para editar el contenido en Sanity.</p>

    @if (configError(); as cfgErr) {
      <p class="login__error" role="alert">{{ cfgErr }}</p>
      <p class="login__hint">
        Guía:
        <code>docs/auth-setup.md</code>
      </p>
    } @else {
      <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label class="login__field">
          <span>Correo</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="username"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
        </label>

        <label class="login__field">
          <span>Contraseña</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
        </label>

        @if (errorMessage(); as err) {
          <p class="login__error" role="alert">{{ err }}</p>
        }

        <button type="submit" class="login__submit" [disabled]="submitting()">
          {{ submitting() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    }
  </div>
</section>
