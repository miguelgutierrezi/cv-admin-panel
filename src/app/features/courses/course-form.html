<section class="page">
  <header class="page__head">
    <div>
      <a class="back" routerLink="/courses">← Courses</a>
      <h1>{{ isNew() ? 'Nuevo course' : 'Editar course' }}</h1>
    </div>
    <div class="page__actions">
      @if (!isNew()) {
        <button type="button" class="btn btn--ghost" [disabled]="deleting()" (click)="remove()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      }
      <button type="button" class="btn" [disabled]="saving() || loading()" (click)="save()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </header>

  @if (loading()) {
    <p>Cargando…</p>
  } @else {
    <form class="form" [formGroup]="form" (ngSubmit)="save()">
      <label class="field"
        ><span>slug (kebab-case)</span><input formControlName="slug"
      /></label>
      <div class="field-row">
        <label class="field"><span>title ES</span><input formControlName="titleEs" /></label>
        <label class="field"><span>title EN</span><input formControlName="titleEn" /></label>
      </div>
      <label class="field"><span>institution</span><input formControlName="institution" /></label>
      <div class="field-row">
        <label class="field"><span>date ES</span><input formControlName="dateEs" /></label>
        <label class="field"><span>date EN</span><input formControlName="dateEn" /></label>
      </div>
      <label class="field"
        ><span>imageUrl (assets/… o https)</span><input formControlName="imageUrl"
      /></label>
      <label class="field"
        ><span>credentialUrl (https, opcional)</span><input formControlName="credentialUrl"
      /></label>
      <label class="field"
        ><span>sortOrder</span><input type="number" formControlName="sortOrder"
      /></label>

      @if (message(); as ok) {
        <p class="ok" role="status">{{ ok }}</p>
      }
      @if (error(); as err) {
        <p class="err" role="alert">{{ err }}</p>
      }
    </form>
  }
</section>
