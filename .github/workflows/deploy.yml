name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-admin-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Production build (admin SPA)
        run: npm run build

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting (admin) + Functions
        run: npx firebase-tools deploy --only hosting:admin,functions --project miguel-angel-gutierrez-ibague --non-interactive
