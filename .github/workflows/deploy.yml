name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-admin-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Production build (admin SPA)
        run: npm run build

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Hosting first so a flaky Functions/Service Usage 500 does not block the SPA.
      - name: Deploy Hosting (admin site)
        run: npx firebase-tools deploy --only hosting:admin --project miguel-angel-gutierrez-ibague --non-interactive --force

      # Service Usage sometimes returns 500 while "ensuring" APIs; retry a few times.
      - name: Deploy Functions (sanityWrite)
        run: |
          set -e
          for i in 1 2 3; do
            echo "Functions deploy attempt $i..."
            if npx firebase-tools deploy --only functions --project miguel-angel-gutierrez-ibague --non-interactive --force; then
              echo "Functions deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed; waiting before retry..."
            sleep $((i * 20))
          done
          echo "Functions deploy failed after 3 attempts"
          exit 1
